name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # Each service's own behaviour, against stubs and a real database. Nothing here
  # touches another team's code, so it can run without waiting for anything.
  component-tests:
    name: Component tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: |
          dotnet test tests/InventoryService.ComponentTests --logger "trx;LogFileName=inventory.trx"
          dotnet test tests/PaymentService.ComponentTests   --logger "trx;LogFileName=payment.trx"
          dotnet test tests/OrderService.ComponentTests     --logger "trx;LogFileName=order.trx"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: component-test-results
          path: '**/TestResults/*.trx'

  # The consumer half of every contract. This job records what each consumer needs
  # and publishes it; it deliberately does not verify anything, because a consumer
  # cannot speak for a provider.
  consumer-contracts:
    name: Consumer contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Generate pacts
        run: |
          dotnet test tests/OrderService.ContractTests
          dotnet test tests/NotificationService.ContractTests

      - name: Fail if the committed pacts are stale
        run: |
          if ! git diff --quiet -- pacts; then
            echo "::error::The generated pacts differ from the committed ones. Run the consumer contract tests and commit the result."
            git --no-pager diff -- pacts
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: pacts
          path: pacts/*.json

  # The provider half. In a real system this is a separate repository's pipeline,
  # triggered by a broker webhook when a consumer publishes. Here it is a separate
  # job that waits for the pacts, which is the same shape.
  provider-verification:
    name: Provider verification
    runs-on: ubuntu-latest
    needs: consumer-contracts
    env:
      PACT_BROKER_BASE_URL: http://localhost:9292
      PACT_BROKER_USERNAME: pact
      PACT_BROKER_PASSWORD: pact
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/download-artifact@v4
        with:
          name: pacts
          path: pacts

      - name: Start the broker
        run: |
          docker compose up -d postgres pact-broker
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:9292/diagnostic/status/heartbeat > /dev/null; then
              echo "broker is up"; exit 0
            fi
            sleep 5
          done
          echo "::error::The broker did not become reachable"
          docker compose logs pact-broker | tail -50
          exit 1

      - name: Publish pacts
        run: bash scripts/publish-pacts.sh
        env:
          PACT_BROKER_BASE_URL: http://host.docker.internal:9292
          GIT_COMMIT: ${{ github.sha }}
          GIT_BRANCH: ${{ github.head_ref || github.ref_name }}

      - name: Verify
        run: |
          dotnet test tests/InventoryService.ContractTests
          dotnet test tests/PaymentService.ContractTests
          dotnet test tests/OrderService.MessageContractTests
        env:
          GIT_COMMIT: ${{ github.sha }}
          GIT_BRANCH: ${{ github.head_ref || github.ref_name }}

      # Not a test. It asks the broker whether the whole system would still agree
      # if this commit shipped, which no single suite can answer.
      - name: can-i-deploy
        run: |
          for app in OrderService InventoryService PaymentService NotificationService; do
            echo "::group::$app"
            bash scripts/can-i-deploy.sh "$app" "${{ github.sha }}"
            echo "::endgroup::"
          done
        env:
          PACT_BROKER_BASE_URL: http://host.docker.internal:9292

      - name: Broker logs
        if: failure()
        run: docker compose logs pact-broker | tail -100
